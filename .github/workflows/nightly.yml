name: Nightly fuzzing
# turf-fuzz item 7. Every night, by the owner's decision (2026-10-14: nightly,
# 00:00 IST, about three hours; it was weekly, Mondays 00:00 IST, since
# 2026-10-12): the fuzzing tiers cost hours, and turflang's own CI never
# depends on this repo. Each job budgets about three hours of fuzzing
# wall-clock, so a job (build and report included) ends in under five and
# the 6 h job limit is never in play; the matrix and the other jobs run side
# by side.
#
#   process (pinned)  the compiler at compiler.lock: reproducible, every
#                     finding replays with the lock as recorded
#   process (master)  turflang's latest master: catches what changed since
#   sanitized         tier 0 against the ASan + UBSan compiler from master
#                     (turflang's former nightly crash fuzz)
#   engine            libFuzzer over the front end at the lock, continuing
#                     from last night's corpus (kept as an artifact)
#
# Only new signatures are filed: a finding whose directory is already under
# findings/ (committed) just bumps its counter. ci/file-issues.sh files one
# issue per new signature, titled "Nightly fuzz: <signature>" (shared by the
# jobs, so pinned and master find one issue). If an open issue has exactly
# that title it gets a comment (job, date, run, compiler)
# instead, so a finding not yet committed is not filed again every night. At
# most 10 new issues per job per night; the rest go into one overflow issue.
# The engine's inputs have no signature (a bug comes back under a new hash),
# so they are grouped by kind (crash, timeout, oom): one issue per kind, with
# the same comment-if-open rule. Each issue is labelled fuzz-finding,
# kind:<class> (ice, crash, miscompile, ...) and compiler:<pinned, master or
# sanitized>; missing labels are created (ci/labels.sh). The reports, findings and corpus are
# artifacts. The logic is in ci/*.sh, runnable locally.
#
# turflang is public, so this workflow's own token checks it out. Should it
# go private, add a repository secret TURFLANG_TOKEN (read access to
# turf-lang/turf-lang's contents) and it is used instead. The pinned commit
# must have been pushed to turflang.
on:
  schedule:
    # Every day at 00:00 IST (owner, 2026-10-14; weekly on Mondays before).
    # Cron is in UTC: 18:30 the day before.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      diff_seconds:
        description: "Differential oracle budget per compiler (seconds)"
        default: "7200"
      tier0_seconds:
        description: "Tier-0 crash fuzzer budget per compiler (seconds)"
        default: "2400"
      engine_seconds:
        description: "libFuzzer budget (seconds)"
        default: "10800"
      sanitized_seconds:
        description: "Sanitized tier-0 crash fuzz budget (seconds)"
        default: "10800"
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  process:
    strategy:
      fail-fast: false
      matrix:
        compiler: [pinned, master]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: turf-fuzz
      - name: Which turflang commit
        id: ref
        run: |
          if [ "${{ matrix.compiler }}" = pinned ]; then
            echo "ref=$(sed -n 's/^commit = //p' turf-fuzz/compiler.lock)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: turf-lang/turf-lang
          ref: ${{ steps.ref.outputs.ref }}
          path: turflang
          token: ${{ secrets.TURFLANG_TOKEN || github.token }}
          submodules: false
      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-22
            /usr/include/llvm-22
            /usr/include/llvm-c-22
          key: llvm-22-${{ runner.os }}-v1
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake
      - run: echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-fuzz-${{ matrix.compiler }}-${{ steps.ref.outputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-fuzz-${{ matrix.compiler }}-
            ccache-fuzz-
      # build_asan first: both trees write the plain lib/libturfrt.a, and the
      # plain build's must be the one left (turflang AGENTS.md).
      - name: Build turfc and the ASan-runtime turfc
        run: |
          export CC="ccache gcc" CXX="ccache g++"
          cmake -S turflang -B turflang/build_asan -DCMAKE_BUILD_TYPE=Release \
            -DTURF_RT_SANITIZE=ON -DTURF_SMART=OFF -DTURF_BUILD_CLI=OFF
          cmake --build turflang/build_asan -j "$(nproc)"
          cmake -S turflang -B turflang/build -DCMAKE_BUILD_TYPE=Release \
            -DTURF_SMART=OFF -DTURF_BUILD_CLI=OFF
          cmake --build turflang/build -j "$(nproc)"
      - name: Fuzz (differential + reduction, soundness, tier 0)
        env:
          TURF_ROOT: ${{ github.workspace }}/turflang
          DIFF_SECONDS: ${{ github.event.inputs.diff_seconds || '7200' }}
          TIER0_SECONDS: ${{ github.event.inputs.tier0_seconds || '2400' }}
          OUT: ${{ github.workspace }}/ci-out
        run: |
          turf-fuzz/ci/process.sh
          cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report and new findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-process-${{ matrix.compiler }}
          path: ci-out/
          retention-days: 30
      - name: File issues for new signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A soundness failure is keyed by verdict and case, not its detail text,
          # which can differ night to night.
          { cat ci-out/new-findings.txt; awk '{print "soundness/" $1 "/" $2}' ci-out/soundness.txt; } > ci-out/items.txt
          COMPILER_SHA=$(git -C turflang rev-parse HEAD) turf-fuzz/ci/file-issues.sh \
            "process/${{ matrix.compiler }}" ci-out/items.txt "nightly-process-${{ matrix.compiler }}"

  # turflang's nightly crash fuzz, moved here (owner, 2026-10-12): tier 0
  # against the compiler built with ASan + UBSan from turflang's master, so a
  # memory error in a compiler pass is a finding even when the plain build
  # survives it. turflang keeps a three-minute pass per push.
  sanitized:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: turf-fuzz
      - uses: actions/checkout@v4
        with:
          repository: turf-lang/turf-lang
          ref: master
          path: turflang
          token: ${{ secrets.TURFLANG_TOKEN || github.token }}
          submodules: false
      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-22
            /usr/include/llvm-22
            /usr/include/llvm-c-22
          key: llvm-22-${{ runner.os }}-v1
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake
      - run: echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Install ccache
        run: sudo apt-get install -y ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-fuzz-san-${{ github.run_id }}
          restore-keys: |
            ccache-fuzz-san-
      - name: Build the sanitized turfc
        run: |
          export CC="ccache gcc" CXX="ccache g++"
          cmake -S turflang -B turflang/build_san -DCMAKE_BUILD_TYPE=Release \
            -DTURF_SANITIZE_COMPILER=ON -DTURF_SMART=OFF -DTURF_BUILD_CLI=OFF
          cmake --build turflang/build_san -j "$(nproc)"
      - name: Fuzz
        env:
          TURF_ROOT: ${{ github.workspace }}/turflang
          SANITIZED_SECONDS: ${{ github.event.inputs.sanitized_seconds || '10800' }}
          OUT: ${{ github.workspace }}/ci-out
        run: |
          turf-fuzz/ci/sanitized.sh
          cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report and new findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-sanitized
          path: ci-out/
          retention-days: 30
      - name: File issues for new signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMPILER_SHA=$(git -C turflang rev-parse HEAD) turf-fuzz/ci/file-issues.sh \
            sanitized ci-out/new-findings.txt nightly-sanitized

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          path: turf-fuzz
      - name: Which turflang commit
        id: ref
        run: echo "ref=$(sed -n 's/^commit = //p' turf-fuzz/compiler.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: turf-lang/turf-lang
          ref: ${{ steps.ref.outputs.ref }}
          path: turflang
          token: ${{ secrets.TURFLANG_TOKEN || github.token }}
          submodules: false
      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            /usr/lib/llvm-22
            /usr/include/llvm-22
            /usr/include/llvm-c-22
          key: llvm-22-${{ runner.os }}-v1
      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev cmake
      # The cache holds LLVM's tree; clang, libFuzzer's runtime and ninja are
      # installed each time (apt.llvm.org is already a source after llvm.sh,
      # and is added here when the cache skipped it).
      - name: Install clang, compiler-rt, ninja
        run: |
          if ! command -v clang++-22 >/dev/null; then
            wget -q https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 22
          fi
          sudo apt-get install -y clang-22 libclang-rt-22-dev ninja-build
      - run: echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Build the libFuzzer targets
        run: |
          CC=clang-22 CXX=clang++-22 cmake -S turf-fuzz/engine -B turf-fuzz/engine/build -G Ninja \
            -DTURF_ROOT="$GITHUB_WORKSPACE/turflang"
          cmake --build turf-fuzz/engine/build -j "$(nproc)" --target fuzz_analyze fuzz_analyze_tok
      # The latest successful run that left an engine-corpus artifact:
      # nightly.yml first, then weekly.yml (the workflow this one replaced),
      # so the first nights start from the existing corpus, not the seeds.
      - name: Restore last night's corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev-corpus
          for wf in nightly.yml weekly.yml; do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --status success \
                   --limit 1 --json databaseId -q '.[0].databaseId' || true)
            [ -n "$id" ] || continue
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name engine-corpus --dir prev-corpus; then
              echo "corpus from $wf run $id"
              break
            fi
            echo "no engine-corpus artifact in $wf run $id"
          done
      - name: Fuzz
        env:
          TURF_ROOT: ${{ github.workspace }}/turflang
          ENGINE_SECONDS: ${{ github.event.inputs.engine_seconds || '10800' }}
          CORPUS_IN: ${{ github.workspace }}/prev-corpus
          OUT: ${{ github.workspace }}/ci-out
        run: |
          turf-fuzz/ci/engine.sh
          cat ci-out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-corpus
          path: ci-out/engine-corpus/
          retention-days: 30
      - name: Upload the report and crash inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-engine
          path: |
            ci-out/summary.md
            ci-out/engine*.log
            ci-out/engine-artifacts/
          retention-days: 30
      # libFuzzer inputs have no signature, and the same bug is found under a
      # new hash every night, so they are grouped by the kind in the file name
      # (crash-, timeout-, oom-): one issue per kind, an open one is commented
      # on, not filed again. At most three issues a night, so no cap is needed.
      - name: File issues for crash inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          sha=$(git -C turflang rev-parse HEAD)
          . turf-fuzz/ci/labels.sh
          for kind in crash timeout oom; do
            files=$(ls ci-out/engine-artifacts 2>/dev/null | grep "^$kind-" || true)
            [ -n "$files" ] || continue
            n=$(echo "$files" | wc -l)
            title="Nightly fuzz (engine): $kind inputs"
            num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --search "\"$title\" in:title" \
                    --json number,title | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$GITHUB_REPOSITORY" \
                --body "Seen again $(date -u +%F): $n $kind input(s) in $run (turflang \`$sha\`, artifact \`nightly-engine\`)."
              continue
            fi
            {
              echo "The nightly libFuzzer run found $n input(s) the front end ended in a $kind on (run $run, turflang \`$sha\`, artifact \`nightly-engine\`). Replay one with \`engine/build/fuzz_analyze FILE\` (with \`ulimit -s 65536\`) and triage it into findings/."
              echo
              echo "$files" | sed 's/^/- `/; s/$/`/'
              echo
              echo '```turf'; head -c 3000 "ci-out/engine-artifacts/$(echo "$files" | head -1)"; echo; echo '```'
              echo
              cat ci-out/summary.md
            } > issue-body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md \
              --label "$(labels_for "engine-$kind/" engine)" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          done
